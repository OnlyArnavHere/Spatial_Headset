name: agent-release

on:
  push:
    tags:
      - "agent-v*"

permissions:
  contents: read

env:
  # The LGPL-only PyAV wheels built by agent-deps.yml. Fill URL and SHA-256 (from that release's SHA256SUMS) per
  # platform once it has run; empty means the PyPI av is used and the release stays a pre-release.
  AV_WHEEL_WIN_URL: ""
  AV_WHEEL_WIN_SHA: ""
  AV_WHEEL_MAC_URL: ""
  AV_WHEEL_MAC_SHA: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: agent-win
          - os: macos-14
            artifact: agent-mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Tools/LaptopAgent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install requirements
        run: python -m pip install -r requirements.txt "pyinstaller>=6.22" pip-licenses
      - name: Install the LGPL PyAV wheel (Windows)
        if: runner.os == 'Windows' && env.AV_WHEEL_WIN_URL != '' && env.AV_WHEEL_WIN_SHA != ''
        shell: bash
        env:
          URL: ${{ env.AV_WHEEL_WIN_URL }}
          SHA: ${{ env.AV_WHEEL_WIN_SHA }}
        run: |
          set -euo pipefail
          mkdir -p ../../build/avwheel
          WHEEL="../../build/avwheel/$(basename "$URL")"
          curl -fsSL -o "$WHEEL" "$URL"
          python - "$WHEEL" "$SHA" <<'EOF'
          import hashlib, sys
          got = hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          if got != sys.argv[2].lower():
              sys.exit(f"wheel SHA-256 mismatch: {got}")
          EOF
          python -m pip install --no-deps --force-reinstall "$WHEEL"
      - name: Install the LGPL PyAV wheel (macOS)
        if: runner.os == 'macOS' && env.AV_WHEEL_MAC_URL != '' && env.AV_WHEEL_MAC_SHA != ''
        shell: bash
        env:
          URL: ${{ env.AV_WHEEL_MAC_URL }}
          SHA: ${{ env.AV_WHEEL_MAC_SHA }}
        run: |
          set -euo pipefail
          mkdir -p ../../build/avwheel
          WHEEL="../../build/avwheel/$(basename "$URL")"
          curl -fsSL -o "$WHEEL" "$URL"
          python - "$WHEEL" "$SHA" <<'EOF'
          import hashlib, sys
          got = hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest()
          if got != sys.argv[2].lower():
              sys.exit(f"wheel SHA-256 mismatch: {got}")
          EOF
          python -m pip install --no-deps --force-reinstall "$WHEEL"
      - name: Unit tests
        run: python -m unittest discover -p "test_*.py"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          ./packaging/build_win.ps1
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/build_mac.sh
      # Upload only the loose files in dist/ (zip, setup exe, licences), not the app folder. The least common ancestor
      # of the matched files is Tools/LaptopAgent/dist, so they land flat in the downloaded artifact.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Tools/LaptopAgent/dist/*.zip
            Tools/LaptopAgent/dist/*-setup.exe
            Tools/LaptopAgent/dist/THIRD_PARTY_LICENSES-*.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Decide pre-release
        id: pre
        shell: bash
        run: |
          # Final release only when every wheel URL/SHA is set and the macOS ffmpeg in tools_fetch has a SHA-256.
          FFMPEG_SHA=$(python3 -c "import re,sys; t=open('Tools/LaptopAgent/tools_fetch.py',encoding='utf-8').read(); i=t.index('\"darwin-arm64\"'); m=re.search(r'\"ffmpeg\":\s*\{.*?\"sha256\":\s*\"([0-9a-fA-F]*)\"', t[i:], re.S); print(m.group(1) if m else '')")
          if [ -n "$AV_WHEEL_WIN_URL" ] && [ -n "$AV_WHEEL_WIN_SHA" ] && [ -n "$AV_WHEEL_MAC_URL" ] && [ -n "$AV_WHEEL_MAC_SHA" ] && [ -n "$FFMPEG_SHA" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "darwin ffmpeg sha256: '$FFMPEG_SHA'"; cat "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -lR artifacts
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          prerelease: ${{ steps.pre.outputs.prerelease == 'true' }}
          body: ${{ steps.pre.outputs.prerelease == 'true' && 'Pre-release - not for general distribution (bundled PyAV still contains GPL x264/x265 until the LGPL build lands).' || 'Bundled PyAV and the macOS ffmpeg are the LGPL-only builds from the agent-deps release. See THIRD_PARTY_LICENSES-*.txt.' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/SpatialLauncherAgent-*-setup.exe
            artifacts/SpatialLauncherAgent-*-win64.zip
            artifacts/SpatialLauncherAgent-*-mac-arm64.zip
            artifacts/THIRD_PARTY_LICENSES-win.txt
            artifacts/THIRD_PARTY_LICENSES-mac.txt
